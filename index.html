<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 09: Agenda de contatos</title>
</head>
<body>
      <h1>Meus amigos</h1>
      <hr>
      <form action="#" id="cadastro" method="post">
         <table>
            <tr>
               <td>Nome</td>
               <td>
                  <input type="text" required name="nome" minlength="3"/>
               </td>
            </tr>
            <tr>
               <td>Data de nascimento</td>
               <td>
                  <input type="date" name="nasc"/>
               </td>
            </tr>
            <tr>
               <td>Whatsapp</td>
               <td>
                  <input type="tel" name="whatsapp"/>
               </td>
            </tr>
            <tr>
               <td colspan="2">
                  <input type="submit" value="Adicionar">
                  <input type="reset">
               </td>
            </tr>
         </table>
         <ul id="lista">
            <li>Lista Vazia</li>
         </ul>
      </form>
      <script src="./js/app.js" defer></script>

</body>
</html>
